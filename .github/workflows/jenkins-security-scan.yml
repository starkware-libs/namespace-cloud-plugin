# Jenkins Security Scan.
#
# Normally this file just calls the reusable workflow from
# jenkins-infra/jenkins-security-scan. That workflow references its actions by
# tag, and this repository's organisation requires every action to be pinned to
# a full-length commit SHA, so the call is rejected before it runs.
#
# The upstream job is therefore inlined here with each action pinned. Keep it in
# step with
# https://github.com/jenkins-infra/jenkins-security-scan/blob/main/.github/workflows/jenkins-security-scan.yaml
# (inlined from v2, da7438f10fecc21e40174d420ef34daae0874122).
#
# Once this repository moves into the jenkinsci organisation the policy no
# longer applies, and this file should be replaced by the one-line call to the
# reusable workflow from jenkinsci/archetypes.
name: Jenkins Security Scan

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  security-events: write
  contents: read # For actions/checkout
  actions: read # For github/codeql-action/upload-sarif

jobs:
  scan:
    runs-on: ubuntu-latest # Provides `jq`
    steps:
      - name: Check out plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: java
          config: |
            disable-default-queries: true
            packs:
            - jenkins-infra/jenkins-codeql@0.0.3
            - codeql/java-queries:AlertSuppression.ql
            - codeql/java-queries:AlertSuppressionAnnotations.ql

      - name: Autobuild
        uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3

      - name: Run CodeQL
        id: generate-sarif
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: Jenkins Security Scan
          upload: failure-only

      - name: Process SARIF
        # Process the generated SARIF file:
        # 1. Prevent conflicts with otherwise set up CodeQL scan by renaming the tool driver
        # 2. Remove suppressed warnings because GitHub Code Scanning does not support inline suppressions
        run: |
          jq 'setpath(path(.runs[].tool.driver.name); "Jenkins Security Scan") | setpath(path(.runs[].tool.driver.organization); "Jenkins Project") | del(.runs[].results[] | select( .suppressions | length != 0 ))' ../results/java.sarif > jenkins-security-scan.sarif
          mv -v ../results/java.sarif .

      - name: Archive SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          path: '*.sarif'
          name: Jenkins Security Scan SARIF

      - name: Upload Scan Result
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: jenkins-security-scan.sarif
          category: Jenkins Security Scan
