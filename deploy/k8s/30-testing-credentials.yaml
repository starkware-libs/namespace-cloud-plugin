# TESTING ONLY — plaintext credentials in a ConfigMap.
#
# This is no safer than a Secret: both store the value unencrypted in the
# manifest and in etcd. A ConfigMap is strictly worse, because it is not
# redacted in `kubectl get -o yaml`, is not treated as sensitive by RBAC
# defaults, and will not be caught by secret-scanning if this ever does get
# committed.
#
# Before this goes anywhere near git or a shared cluster, replace this file
# with the ExternalSecret pair (you already run external-secrets). The
# Deployment reads these through env vars, so that swap is a change to
# configMapKeyRef -> secretKeyRef and nothing else.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-testing-credentials
  namespace: jenkins-ns
data:
  admin-username: admin

  # Admin login for the controller.
  admin-password: CHANGE-ME

  # Mint with:
  #   nsc token create \
  #     --name jenkins \
  #     --expires_in 720h \
  #     --grant '{"resource_type":"instance","resource_id":"*","actions":["create","destroy","get","list","wait"]}' \
  #     --grant '{"resource_type":"instance/o11y/logs","resource_id":"*","actions":["get"]}'
  #
  # resource_id is NOT optional: without it the token can create and list
  # instances but cannot get, wait on, or destroy them.
  namespace-token: CHANGE-ME
