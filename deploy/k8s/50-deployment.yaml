apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins-ns
  labels:
    app.kubernetes.io/name: jenkins
spec:
  replicas: 1
  # Jenkins owns JENKINS_HOME exclusively and the PVC is ReadWriteOnce, so the
  # old pod must be gone before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins
    spec:
      serviceAccountName: jenkins
      securityContext:
        # The official image runs as uid 1000; fsGroup makes the PVC writable.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # Installs the plugin's dependencies from the update centre into a
        # shared volume, which the controller then picks up from its ref dir.
        # This is what lets us run the stock image with no private registry:
        # namespace-cloud.hpi itself is uploaded through the UI afterwards.
        - name: install-dependencies
          image: jenkins/jenkins:lts-jdk21
          command: [jenkins-plugin-cli]
          args:
            - --verbose
            - --plugin-download-directory=/shared-plugins
            - --plugins
            - caffeine-api
            - credentials
            - plain-credentials
            - ssh-credentials
            - ssh-slaves
            - workflow-aggregator
            - configuration-as-code
          volumeMounts:
            - name: plugin-ref
              mountPath: /shared-plugins
      containers:
        - name: jenkins
          # Stock image. The plugin under test is uploaded at
          # /manage/pluginManager/advanced once this is up.
          image: jenkins/jenkins:lts-jdk21
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            # No JNLP port: the plugin connects agents over WebSocket on 443,
            # so port 50000 is deliberately not exposed.
          env:
            - name: CASC_JENKINS_CONFIG
              value: /var/jenkins_config/jenkins.yaml
            # TESTING: sourced from a ConfigMap. Switch these three to
            # secretKeyRef (against ExternalSecret-managed Secrets) before this
            # is used by anyone but you.
            - name: JENKINS_ADMIN_USER
              valueFrom:
                configMapKeyRef: { name: jenkins-testing-credentials, key: admin-username }
            - name: JENKINS_ADMIN_PASSWORD
              valueFrom:
                configMapKeyRef: { name: jenkins-testing-credentials, key: admin-password }
            - name: NAMESPACE_TOKEN
              valueFrom:
                configMapKeyRef: { name: jenkins-testing-credentials, key: namespace-token }
            - name: JAVA_OPTS
              # The wizard is skipped because JCasC defines the security realm;
              # without that config this would leave Jenkins wide open.
              value: >-
                -Djenkins.install.runSetupWizard=false
                -Dhudson.model.DirectoryBrowserSupport.CSP=
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
            - name: jenkins-casc
              mountPath: /var/jenkins_config
              readOnly: true
            # The entrypoint copies anything here into JENKINS_HOME/plugins on
            # boot, so the init container's downloads become installed plugins.
            - name: plugin-ref
              mountPath: /usr/share/jenkins/ref/plugins
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:  { memory: "3Gi" }
          startupProbe:
            httpGet: { path: /login, port: http }
            # Jenkins can take a while on first boot while plugins initialise.
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /login, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: jenkins-home
        - name: jenkins-casc
          configMap:
            name: jenkins-casc
        - name: plugin-ref
          emptyDir: {}
