<div>
  Extra environment variables for the agent container, one
  <code>KEY=VALUE</code> per line. Lines starting with <code>#</code> are
  ignored.
  <p>
    Jenkins' own wiring (<code>JENKINS_URL</code>, <code>JENKINS_SECRET</code>,
    <code>JENKINS_AGENT_NAME</code>) is set automatically and must not be
    overridden here.
  </p>
</div>
